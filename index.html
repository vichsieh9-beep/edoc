<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDoc Library</title>
<style>
:root{--bg:#1f1f1f;--card:#292929;--text:#f2f2f2;--muted:#b6b6b6;--line:#484848;--blue:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:52px 24px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:var(--muted);margin-bottom:30px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.card:hover{border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.title{font-size:20px;font-weight:800}
.badge{font-size:12px;border:1px solid #2e79b7;background:#174a78;color:#dff0ff;border-radius:999px;padding:2px 8px}
.meta{color:var(--muted);margin-top:8px;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
<h1>EDoc Library</h1>
<div class="sub">公開文件與版本歷史</div>
<a class="card" href="./documents/qa-senior-game-qa/">
  <div class="row">
    <span class="title">【QA】資深遊戲測試工程師</span>
    <span class="badge">v0.7 Current</span>
  </div>
  <div class="meta">Senior Game QA Engineer · Editable Document</div>
</a>
</main>
</body>
</html>
