<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDoc 文件庫</title>
<style>
{{style}}</style>
</head>
<body>
<header class="head"><div class="head-inner">
  <h1>EDoc 文件庫</h1>
  <div class="sub">可公開分享、有完整版本紀錄的文件</div>
  <span class="chip admin who" id="who" hidden></span>
</div></header>
<main class="wrap">
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="搜尋文件名稱" aria-label="搜尋文件名稱" autocomplete="off">
    <label class="toggle" id="archToggle" hidden><input type="checkbox" id="archCheck">顯示已封存（<span id="archCount">0</span>）</label>
    <button class="primary" id="newBtn" hidden>＋ 新增文件</button>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="list" id="list">
{{rows}}
  </div>
  <div class="empty" id="empty" hidden>找不到符合的文件</div>
  <div class="note" id="visitorNote">點文件名稱開啟；每份文件都能切換版本、查看差異與下載 PDF。</div>
</main>
<script id="libraryData" type="application/json">{{libraryData}}</script>
<script>
{{script}}</script>
</body>
</html>
