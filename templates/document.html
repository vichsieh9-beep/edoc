<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — EDoc {{latestVersion}}</title>
<style>
{{style}}</style>
</head>
<body>
<header class="doc-head" id="docHead">
  <div class="doc-title">{{title}}</div>
  <div class="read-bar">
    <div class="version-control" id="versionControl">
      <button class="version-button" id="versionButton">
        <span id="versionLabel">{{latestVersion}} · Current</span><span class="caret">▼</span>
      </button>
      <div class="version-menu" id="versionMenu"></div>
    </div>
    <button id="toggleChanges" class="toggle on">顯示變更：開</button>
  </div>
  <div class="bar-row solo" id="barRow">
    <div class="group edit-group" id="editGroup" hidden>
      <span class="chip who" id="whoChip"></span>
      <span class="chip state" id="stateChip">正式版・唯讀</span>
      <button id="newRevisionBtn" class="primary">開始修訂</button>
      <button id="finishRevisionBtn" class="primary" hidden>完成修訂-版本更新</button>
      <button id="discardRevisionBtn" hidden>放棄修訂</button>
    </div>
    <div class="group share-group">
      <button id="shareUrlBtn" disabled>複製公開網址</button>
      <button id="copyBtn">複製全文</button>
      <a id="pdfBtn" class="button" href="#" download>下載 PDF</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden>
    <span id="noticeText"></span><span class="notice-actions" id="noticeActions"></span>
  </div>

  <section class="version-card" id="versionCard">
    <div class="version-card-head">
      <span class="version-card-title" id="cardTitle"></span>
      <span class="badge" id="compareBadge"></span>
      <span class="badge" id="statusBadge"></span>
      <span class="badge publish" id="publishBadge" hidden></span>
    </div>
    <div class="version-card-summary" id="cardSummary"></div>
    <div class="publish-note" id="publishNote" hidden></div>
    <div class="hash-text" id="versionHash"></div>
    <details id="changeDetails">
      <summary>詳細變更</summary>
      <ul id="detailList"></ul>
    </details>
  </section>

  <section class="revision-panel" id="revisionPanel">
    <div class="revision-head">
      <span class="revision-title">Draft</span>
      <span class="badge" id="revisionBase"></span>
    </div>
    <div class="revision-summary" id="revisionSummary"></div>
    <div class="revision-meta" id="revisionMeta"></div>
    <div class="hash-text" id="revisionHash"></div>
  </section>

  <div id="doc" class="doc" contenteditable="false" spellcheck="false"></div>

  <div class="legend">
    <span class="dot blue"></span>藍色＝本版新增或修改
    <span class="dot red"></span>紅色刪除線＝本版刪除
    <div class="hint">正式版本永久唯讀。有編輯權限的人按「開始修訂」即可直接修改；按「完成修訂-版本更新」後，系統會自動比對、產生摘要並發布新版本。</div>
  </div>
  <footer class="engine-foot">EDoc {{engineVersion}}</footer>
</main>

<div class="modal-backdrop" id="dialog">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h3 id="dialogTitle"></h3>
    <div class="dialog-summary" id="dialogSummary"></div>
    <div class="dialog-note" id="dialogNote"></div>
    <div class="modal-actions" id="dialogActions"></div>
  </div>
</div>

<script id="documentMeta" type="application/json">{{documentMeta}}</script>
<script id="versionData" type="application/json">{{versionData}}</script>
<script id="documentState" type="application/json">{{documentState}}</script>
<script id="revisionData" type="application/json">{{revisionData}}</script>
<script>
{{script}}</script>
</body>
</html>
