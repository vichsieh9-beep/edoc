<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【QA】資深遊戲測試工程師 — EDoc v0.7</title>
<style>
:root {
  --bg:#232323; --panel:#2b2b2b; --text:#f2f2f2; --muted:#b9b9b9;
  --line:#4a4a4a; --changed:#4aa3ff; --deleted:#ff6b6b;
  --green:#4ecb8d; --button:#383838; --button-hover:#454545;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.7}
.toolbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:12px 18px;background:rgba(28,28,28,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.toolbar .title{font-weight:700;margin-right:auto}
button{appearance:none;border:1px solid #555;background:var(--button);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.65;cursor:default}
.state-blue{background:#174a78!important;border-color:#2e79b7!important;color:#dff0ff!important}
.state-green{background:#1f5a3a!important;border-color:#3d8a61!important;color:#e3f7eb!important}
.state-gray{background:#3a3a3a!important;border-color:#5a5a5a!important;color:#e8e8e8!important}
.state-red{background:#653232!important;border-color:#985050!important;color:#ffe6e6!important}
.ui-changed{box-shadow:0 0 0 2px rgba(74,163,255,.95),0 0 18px rgba(74,163,255,.18)!important}

.version-control{position:relative}
.version-button{min-width:126px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px}
.version-button .caret{font-size:11px;color:var(--muted)}
.version-menu{position:absolute;top:calc(100% + 8px);left:0;width:390px;max-width:min(90vw,390px);
  background:#202020;border:1px solid #555;border-radius:12px;padding:7px;box-shadow:0 18px 45px rgba(0,0,0,.42);display:none;z-index:40}
.version-menu.open{display:block}
.version-item{padding:10px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.version-item:hover{background:#303030}
.version-item.active{background:#183b5b;border-color:#2e79b7}
.version-row{display:flex;align-items:center;gap:8px;font-weight:700}
.version-current{font-size:11px;color:#bfe0ff;border:1px solid #2e79b7;border-radius:999px;padding:1px 7px}
.version-summary{margin-top:3px;color:#c9c9c9;font-size:12px;line-height:1.45}

.wrap{max-width:980px;margin:0 auto;padding:34px 28px 80px}
.version-card{margin-bottom:24px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:#292929}
.version-card.ui-changed{border-color:#2e79b7}
.version-card-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.version-card-title{font-weight:800}
.badge{display:inline-block;font-size:11px;border:1px solid #555;border-radius:999px;padding:2px 8px;color:var(--muted)}
.badge.current{background:#174a78;border-color:#2e79b7;color:#dff0ff}
.badge.readonly{background:#4a3922;border-color:#87683d;color:#ffdca8}
.version-card-summary{margin-top:6px}
details{margin-top:8px}
summary{cursor:pointer;color:#d7d7d7}
details ul{margin-top:6px}

.doc{outline:none}
.doc.editing{box-shadow:0 0 0 1px rgba(74,163,255,.22) inset;border-radius:10px;padding:18px;margin:-18px}
h1{font-size:30px;line-height:1.3;margin:0 0 30px}
h2{font-size:21px;margin:34px 0 14px}
ul{padding-left:24px} li{margin:7px 0} ul ul{margin-top:6px}
hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.changed{color:var(--changed)!important}
.deleted{color:var(--deleted)!important;text-decoration:line-through;opacity:.92}
.clean .changed{color:inherit!important}
.clean .deleted{display:none}
.legend{margin-top:30px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.blue{background:var(--changed)} .dot.red{background:var(--deleted)}
.hint{color:var(--muted);font-size:13px}
@media(max-width:720px){.wrap{padding:26px 18px 60px}h1{font-size:24px}.version-menu{left:auto;right:0;width:340px}}
@media print{
  body{background:white;color:black} .toolbar,.legend{display:none!important} .wrap{max-width:none;padding:0}
  .version-card{border:1px solid #bbb;background:white} .changed{color:black!important} .deleted{display:none!important}
  .doc{box-shadow:none!important;padding:0!important;margin:0!important}
}

.dirty-badge{display:none;font-size:11px;border:1px solid #8b6f2f;border-radius:999px;
padding:2px 8px;color:#ffe6a6;background:#4b3c1d}
.dirty-badge.show{display:inline-block}

/* --EDoc collaboration layer */
.revision-button{background:#5a431d!important;border-color:#9a7130!important;color:#ffe7b1!important}
.action-purple{background:#493269!important;border-color:#7856a3!important;color:#eee1ff!important}
.action-cyan{background:#164d59!important;border-color:#2b8190!important;color:#dffaff!important}
.action-orange{background:#65451f!important;border-color:#9c6d32!important;color:#fff0d8!important}
.action-accept{background:#24583a!important;border-color:#4b9568!important;color:#e4f8eb!important}
.revision-panel{display:none;margin:0 0 24px;padding:14px 16px;border:1px solid #956f2f;border-radius:11px;background:#332a1d}
.revision-panel.show{display:block}
.revision-panel.conflict{border-color:#a34848;background:#382222}
.revision-head{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.revision-title{font-weight:800;color:#ffe2a5}
.revision-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;color:#d1c2a5;font-size:12px}
.revision-summary{margin-top:7px}
.revision-conflict{display:none;margin-top:9px;color:#ffb6b6;font-weight:700}
.revision-panel.conflict .revision-conflict{display:block}
.hash-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#aaa;word-break:break-all;margin-top:7px}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex}
.modal{width:min(520px,96vw);background:#252525;border:1px solid #555;border-radius:14px;padding:20px;box-shadow:0 28px 80px rgba(0,0,0,.58)}
.modal h3{margin:0 0 14px;font-size:19px}
.field{margin:11px 0}
.field label{display:block;font-size:12px;color:#bdbdbd;margin-bottom:4px}
.field input,.field textarea{width:100%;background:#181818;color:#f3f3f3;border:1px solid #555;border-radius:8px;padding:9px 10px;font:inherit}
.field textarea{min-height:78px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.hidden-input{display:none}
.revision-changed{color:var(--changed)!important}
.deletion-record{color:var(--deleted)!important;text-decoration:line-through;opacity:.9}
.clean .revision-changed{color:inherit!important}
.clean .deletion-record{display:none!important}
.readonly-note{font-size:12px;color:#bbb;padding:2px 8px;border:1px solid #555;border-radius:999px}
.engine-badge{font-size:11px;color:#bfe0ff;border:1px solid #2e79b7;border-radius:999px;padding:2px 8px;background:#173650}
.publish-status{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid #555;color:#bbb}
.publish-status.live{background:#18492f;border-color:#3b8b5d;color:#dff6e8}
.publish-status.local{background:#3a3a3a;border-color:#5a5a5a;color:#ddd}
.share-button{background:#21425f!important;border-color:#3e79a8!important;color:#e2f2ff!important}

.editor-backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:20px}
.editor-backdrop.show{display:flex}
.editor-dialog{width:min(420px,94vw);background:#252525;border:1px solid #555;border-radius:12px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.editor-dialog h3{margin:0 0 12px;font-size:18px}
.editor-dialog input{width:100%;background:#181818;color:#f2f2f2;border:1px solid #555;border-radius:8px;padding:10px 11px;font:inherit}
.editor-dialog .hint{margin-top:7px}
.editor-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

@media(max-width:900px){.toolbar .title{width:100%;margin-right:0}.version-control{margin-right:auto}}

/* AI semantic summary (Phase 4) */
.ai-chip{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;border:1px solid #7856a3;background:#493269;color:#eee1ff;border-radius:999px;padding:0 7px;margin-right:7px;vertical-align:1px}
.ai-stat{margin-top:4px;color:#a9a9a9;font-size:13px}
.ai-sec{margin:8px 0 2px;color:#cdb8f5;font-size:13px;font-weight:700;list-style:none}
.ai-meta{color:#8f8f8f;font-size:11px;font-weight:400;margin-left:6px}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <div class="title">【QA】資深遊戲測試工程師</div><span class="engine-badge">EDoc Engine R2.6 · Publish Ready</span>

  <div class="version-control" id="versionControl">
    <button class="version-button" id="versionButton">
      <span id="versionLabel">v0.7 · Current</span><span class="caret">▼</span>
    </button>
    <div class="version-menu" id="versionMenu"></div>
  </div>

  <button id="toggleChanges" class="state-blue">顯示變更：開</button>

  <button id="shareUrlBtn" class="share-button" disabled>複製公開網址</button>
  <button id="copyBtn">複製全文</button>
  <button id="exportReviewBtn" class="action-cyan">匯出審閱版</button>
  <button id="exportRevisionBtn" class="action-purple" disabled>匯出修訂包</button>
  <button id="importRevisionBtn" class="action-orange">匯入修訂</button>

  <button id="acceptRevisionBtn" class="action-accept" disabled>建立新版本</button>

</div>

<main class="wrap">
  <section class="version-card" id="versionCard">
    <div class="version-card-head">
      <span class="version-card-title" id="cardTitle"></span>
      <span class="badge" id="compareBadge"></span>
      <span class="badge" id="statusBadge"></span>
    </div>
    <div class="version-card-summary" id="cardSummary"></div>
    <div class="hash-text" id="versionHash"></div>
    <details id="changeDetails">
      <summary>詳細變更</summary>
      <ul id="detailList"></ul>
    </details>
  </section>

  <section class="revision-panel" id="revisionPanel">
    <div class="revision-head">
      <span class="revision-title" id="revisionTitle"></span>
      <span class="badge" id="revisionBase"></span>
      <span class="badge" id="revisionStatus"></span>
    </div>
    <div class="revision-summary" id="revisionSummary"></div>
    <div class="revision-meta" id="revisionMeta"></div>
    <div class="hash-text" id="revisionHash"></div>
    <div class="revision-conflict" id="revisionConflict">此修訂不是基於目前最新版，需人工合併後才能接受為新版本。</div>
  </section>

  <div id="doc" class="doc" contenteditable="false" spellcheck="false"></div>

  <div class="legend">
    <span class="dot blue"></span>藍色＝此版本／修訂相較基準新增或修改　
    <span class="dot red"></span>紅色刪除線＝相較基準刪除
    <div class="hint" style="margin-top:8px">正式版本永久唯讀。按「開始修訂」即可直接編輯；建立新版本時系統會自動比對 Base Version、產生 Diff、版本摘要與 Changelog。編輯者為選填，匯入舊基準修訂時會提示衝突。</div>
  </div>
</main>


<div class="editor-backdrop" id="editorBackdrop">
  <div class="editor-dialog">
    <h3>設定編輯者</h3>
    <input id="editorNameInput" type="text" placeholder="例如：Vic、客戶法務、PM">
    <div class="hint">選填，只需設定一次；會儲存在這台瀏覽器。</div>
    <div class="editor-actions">
      <button id="clearEditorBtn">清除</button>
      <button id="cancelEditorBtn">取消</button>
      <button id="saveEditorBtn" class="state-blue">儲存</button>
    </div>
  </div>
</div>

<script id="versionData" type="application/json">{"v0.1":{"summary":"建立第一版 QA 職缺架構。","details":["依參考 JD 格式整理為職務簡述、期望特質、需求條件、加分項目。","包含 iGaming／遊戲 QA、AI 輔助、Log／DevTools／API 等要求。","當時仍保留未來帶人／Lead 相關條件。"],"previous":null,"html":"<h1>【QA】資深遊戲 QA 工程師 Senior QA Engineer<\/h1>\n\n<h2>【職務簡述】<\/h2>\n<ul>\n  <li>負責 iGaming 遊戲產品的品質驗證，主要包含 <strong>Mini Game / Special Game、Slot、骰寶、視訊類遊戲、後台系統及第三方串接功能<\/strong>。<\/li>\n  <li>依據 GDD、產品規格與實際遊戲流程，獨立規劃測試範圍並撰寫完整 Test Case，涵蓋正常流程、異常情境、邊界條件、狀態轉換及玩家可能發生的操作情境。<\/li>\n  <li>執行功能測試、整合測試、回歸測試、跨裝置／瀏覽器測試，並追蹤問題直到驗證完成。<\/li>\n  <li>不只確認功能是否正常，也需要從 <strong>遊戲流程、玩家體驗及系統狀態<\/strong>角度發現潛在品質問題。<\/li>\n  <li>能利用 Log、Browser DevTools、API Request / Response 等資訊進行初步問題定位，提供 RD 足夠且有效的問題資訊。<\/li>\n  <li>針對視訊類遊戲進行延遲、卡頓、斷線重連、弱網、影音同步及遊戲事件同步等品質測試，並整理測試結果與報告。<\/li>\n  <li>參與第三方系統／遊戲串接測試，驗證不同系統間的資料、事件與狀態是否正確。<\/li>\n  <li>與 PM、Game Designer、RD 等角色合作，在需求與開發過程中提出測試風險及異常情境，協助團隊提升產品品質。<\/li>\n  <li>善用生成式 AI 協助 Test Case 補完、Edge Case 發想、Log 分析、測試資料產生、自動化測試及日常 QA 工作，提高測試效率。<\/li>\n  <li>初期需能獨立負責 QA 工作；隨團隊發展，未來可能協助帶領及 Review 1–2 位 QA 成員。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【期望特質】<\/h2>\n<ul>\n  <li><strong>邏輯清楚、具系統化思考能力<\/strong>：能將遊戲拆解成流程、狀態、條件與例外情境，而不是只依畫面逐項操作。<\/li>\n  <li><strong>測試設計能力強<\/strong>：看到一個功能時，能主動思考正常流程之外的 Boundary、Exception、State Transition、Reconnect、Timeout 等測試情境。<\/li>\n  <li><strong>具遊戲理解能力<\/strong>：能快速理解 Game Flow、Round、Game State、Result、Session 等遊戲系統概念。<\/li>\n  <li><strong>追根究底<\/strong>：不只回報功能異常，也願意透過 Log、Network、Console 等資訊盡可能縮小問題範圍。<\/li>\n  <li><strong>具品質與風險意識<\/strong>：能判斷不同功能與流程的風險程度，適當安排測試深度與優先順序。<\/li>\n  <li><strong>能站在玩家角度思考<\/strong>：除了規格正確，也會注意操作體驗、資訊回饋、異常狀況與實際使用情境。<\/li>\n  <li><strong>具獨立作業能力<\/strong>：能自行規劃測試工作、管理進度與品質，不需要等待他人逐項拆解工作。<\/li>\n  <li><strong>具良好溝通協作能力<\/strong>：能清楚向 PM、RD、Game Designer 等角色說明問題、風險與測試結果，與團隊共同解決問題。<\/li>\n  <li><strong>具 AI-native 工作習慣<\/strong>：願意主動使用 AI 工具提升工作效率，也能判斷 AI 產出內容是否合理。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【需求條件】<\/h2>\n<ul>\n  <li>具軟體或遊戲 QA 實務經驗，能獨立負責一個產品或專案的測試工作。<\/li>\n  <li>熟悉基本軟體測試流程，包含：\n    <ul>\n      <li>Test Case 規劃與撰寫<\/li>\n      <li>Functional Test<\/li>\n      <li>Integration Test<\/li>\n      <li>Regression Test<\/li>\n      <li>Bug Tracking<\/li>\n      <li>Test Report<\/li>\n    <\/ul>\n  <\/li>\n  <li>具良好的 <strong>Test Case Design<\/strong> 能力，能從需求自行推導測試情境，而不是只依既有 Case 執行。<\/li>\n  <li>能理解遊戲流程、狀態及事件邏輯；具有遊戲產品 QA 經驗尤佳。<\/li>\n  <li>具基本 <strong>Log 判讀能力<\/strong>，可依時間、事件、Error、Request / Response 等資訊協助問題定位。<\/li>\n  <li>熟悉 Browser DevTools 基本操作，包含 Network、Console、WebSocket、Request / Response、Payload、Storage 等。<\/li>\n  <li>能閱讀基本 API / JSON 資料結構，協助判斷前端、後端或第三方系統問題。<\/li>\n  <li>能撰寫清楚且可重現的 Bug Report，包含環境、前置條件、操作步驟、實際結果、預期結果、發生頻率及相關證據。<\/li>\n  <li>能實際使用生成式 AI 工具協助 QA 工作，如測試設計、測試資料、Log 分析或 Automation。<\/li>\n  <li>能長時間獨立負責 QA 工作，並具備未來協助帶領小型 QA 團隊的能力。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【加分項目】<\/h2>\n<ul>\n  <li>具 <strong>iGaming / Casino Game<\/strong> 相關測試經驗。<\/li>\n  <li>具 Mini Game、Special Game、Slot、骰寶或其他 Table Game 測試經驗。<\/li>\n  <li>具 Live Game／視訊類產品測試經驗。<\/li>\n  <li>熟悉弱網、斷線重連、Latency、Buffering、A/V Sync 等測試情境。<\/li>\n  <li>具 WebSocket 或即時事件系統測試經驗。<\/li>\n  <li>具第三方 API／系統串接測試經驗。<\/li>\n  <li>具基本 SQL 查詢能力，能利用資料庫輔助驗證測試結果。<\/li>\n  <li>了解 Git 基本概念與操作。<\/li>\n  <li>具自動化測試經驗，例如 Playwright、Selenium、Appium 等。<\/li>\n  <li>具 Python、JavaScript 或其他 Scripting 經驗。<\/li>\n  <li>具 CI/CD、自動化 Regression 或測試流程整合經驗。<\/li>\n  <li>有帶領、Mentor 或 Review 其他 QA 成員的經驗。<\/li>\n<\/ul>","uiChanges":[]},"v0.2":{"summary":"重排核心能力，移除帶人條件。","details":["能力優先順序改為：邏輯分析 → 系統／遊戲架構理解 → Test Case 設計。","強化 Game Flow、Round、Game State、事件關係與系統理解。","移除未來帶人、Mentor、Lead 相關要求，避免縮小人才池與造成職涯期待落差。","補強跨職能合作、風險判斷與 Test Case 推導描述。"],"previous":"v0.1","html":"<h1><span class=\"changed\">【QA】遊戲 QA 工程師 (Quality Assurance Engineer)<\/span><\/h1>\n\n<h2>【職務簡述】<\/h2>\n<ul>\n  <li>負責 iGaming 遊戲產品的品質驗證，主要包含 <strong>Mini Game / Special Game、Slot、骰寶、視訊類遊戲、後台系統及第三方串接功能<\/strong>。<\/li>\n  <li class=\"changed\">深入理解遊戲規則、系統架構與運作流程，掌握 Game Flow、Round、Game State、事件及各種狀態間的關聯，據此規劃測試範圍。<\/li>\n  <li>依據 GDD、產品規格與實際遊戲流程，獨立設計及撰寫 Test Case，涵蓋正常流程、異常情境、邊界條件、狀態轉換及玩家可能發生的操作情境。<\/li>\n  <li>執行功能測試、整合測試、回歸測試、跨裝置／瀏覽器測試，並持續追蹤問題直到驗證完成。<\/li>\n  <li>不只確認功能是否符合規格，也需要從 <strong>系統邏輯、遊戲流程與玩家體驗<\/strong>角度主動發現潛在品質問題。<\/li>\n  <li>利用 Log、Browser DevTools、API Request / Response 等資訊進行初步問題定位，盡可能縮小問題範圍並提供 RD 有效資訊。<\/li>\n  <li>針對視訊類遊戲進行延遲、卡頓、斷線重連、弱網、影音同步及遊戲事件同步等品質測試，並整理測試結果與報告。<\/li>\n  <li>參與第三方系統／遊戲串接測試，驗證不同系統之間的資料、事件、狀態及異常處理是否正確。<\/li>\n  <li class=\"changed\">與 PM、Game Designer、RD 等角色合作，在需求與開發過程中提出測試風險、缺漏及異常情境，共同提升產品品質。<\/li>\n  <li>善用生成式 AI 協助 Test Case 補完、Edge Case 發想、Log 分析、測試資料產生、自動化測試及其他 QA 工作，提高測試效率與覆蓋率。<\/li>\n  <li class=\"deleted\">初期需能獨立負責 QA 工作；隨團隊發展，未來可能協助帶領及 Review 1–2 位 QA 成員。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【期望特質】<\/h2>\n<ul>\n  <li><strong>邏輯清楚、具系統化思考能力<\/strong>：能把複雜問題拆解成流程、條件、狀態、事件與例外情境，並理解彼此之間的因果關係。<\/li>\n  <li class=\"changed\"><strong>具良好的系統與遊戲理解能力<\/strong>：面對新的遊戲或功能時，能快速掌握遊戲規則、Game Flow、Round、Game State、Result、Session 等核心概念，而不是只理解畫面上的操作流程。<\/li>\n  <li class=\"changed\"><strong>測試設計能力強<\/strong>：在充分理解系統後，能自行推導正常流程、Boundary、Exception、State Transition、Reconnect、Timeout 等測試情境，建立具完整覆蓋度的 Test Case。<\/li>\n  <li><strong>追根究底<\/strong>：不只回報「功能壞了」，也願意透過 Log、Network、Console、Request / Response 等資訊，盡可能找出問題發生的條件及範圍。<\/li>\n  <li><strong>具品質與風險意識<\/strong>：能判斷不同功能與流程的風險程度，合理安排測試優先順序與測試深度，而不是所有功能採用相同測試方式。<\/li>\n  <li><strong>能站在玩家角度思考<\/strong>：除了驗證規格，也會關注操作體驗、資訊回饋、異常狀況，以及玩家實際可能產生的操作方式。<\/li>\n  <li><strong>具獨立作業能力<\/strong>：能自行理解需求、規劃測試工作、管理測試進度及完成品質驗證，不需要等待他人逐項拆解工作。<\/li>\n  <li><strong>具良好溝通協作能力<\/strong>：能清楚向 PM、RD、Game Designer 說明問題、風險及測試結果，<span class=\"changed\">重點在共同解決問題，而不是增加不必要的流程或審批。<\/span><\/li>\n  <li><strong>具 AI-native 工作習慣<\/strong>：願意主動利用 AI 工具提高工作效率，同時具備判斷及驗證 AI 產出內容的能力，不直接照單全收。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【需求條件】<\/h2>\n<ul>\n  <li>具軟體或遊戲 QA 實務經驗，並具備獨立負責產品或專案測試工作的能力。<\/li>\n  <li class=\"changed\">具良好的邏輯分析能力，能理解功能背後的系統流程、狀態、事件及相互關係。<\/li>\n  <li class=\"changed\">能理解遊戲規則及基本遊戲系統架構，並能將理解轉化為實際測試策略與情境。<\/li>\n  <li class=\"changed\">具良好的 <strong>Test Case Design<\/strong> 能力，能從 GDD、Spec、實際系統行為及風險自行推導測試情境，而不是只依既有 Case 執行。<\/li>\n  <li>熟悉基本軟體測試流程，包含：\n    <ul>\n      <li>Test Case 規劃與撰寫<\/li>\n      <li>Functional Test<\/li>\n      <li>Integration Test<\/li>\n      <li>Regression Test<\/li>\n      <li>Bug Tracking<\/li>\n      <li>Test Report<\/li>\n    <\/ul>\n  <\/li>\n  <li>具基本 <strong>Log 判讀能力<\/strong>，能依據時間、事件、Error、Request / Response 等資訊協助問題定位。<\/li>\n  <li>熟悉 Browser DevTools 基本操作，包含：\n    <ul>\n      <li>Network<\/li>\n      <li>Console<\/li>\n      <li>WebSocket<\/li>\n      <li>Request / Response<\/li>\n      <li>Payload<\/li>\n      <li>Storage<\/li>\n    <\/ul>\n  <\/li>\n  <li>能閱讀基本 API / JSON 資料結構，並利用相關資訊協助判斷前端、後端或第三方系統問題。<\/li>\n  <li>能撰寫清楚且可重現的 Bug Report，包含環境、前置條件、操作步驟、實際結果、預期結果、發生頻率及相關證據。<\/li>\n  <li>能實際運用生成式 AI 工具協助 QA 工作，例如測試設計、Edge Case 補充、測試資料、Log 分析或 Automation。<\/li>\n  <li class=\"changed\">具良好的跨職能溝通能力，能與 PM、RD、Game Designer 等角色有效合作。<\/li>\n  <li class=\"deleted\">能長時間獨立負責 QA 工作，並具備未來協助帶領小型 QA 團隊的能力。<\/li>\n<\/ul>\n\n<hr>\n\n<h2>【加分項目】<\/h2>\n<ul>\n  <li>具 <strong>iGaming / Casino Game<\/strong> 相關測試經驗。<\/li>\n  <li>具 Mini Game、Special Game、Slot、骰寶或其他 Table Game 測試經驗。<\/li>\n  <li>具 Live Game／視訊類產品測試經驗。<\/li>\n  <li>熟悉弱網、斷線重連、Latency、Buffering、A/V Sync 等測試情境。<\/li>\n  <li>具 WebSocket 或即時事件系統測試經驗。<\/li>\n  <li>具第三方 API／系統串接測試經驗。<\/li>\n  <li>具基本 SQL 查詢能力，能利用資料庫輔助驗證測試結果。<\/li>\n  <li>了解 Git 基本概念與操作。<\/li>\n  <li>具自動化測試經驗，例如 Playwright、Selenium、Appium 等。<\/li>\n  <li>具 Python、JavaScript 或其他 Scripting 經驗。<\/li>\n  <li>具 CI/CD、自動化 Regression 或測試流程整合經驗。<\/li>\n  <li>曾實際利用生成式 AI 建立或輔助自動化測試、測試資料生成、Log 分析或其他 QA Workflow。<\/li>\n  <li class=\"deleted\">有帶領、Mentor 或 Review 其他 QA 成員的經驗。<\/li>\n<\/ul>","uiChanges":[]},"v0.3":{"summary":"導入 EDoc：可編輯 HTML 與差異顯示。","details":["改為深色單頁 HTML，可直接局部編輯。","新增藍色＝新增／修改、紅色刪除線＝預計刪除。","新增顯示變更／乾淨版、編輯模式、複製全文、列印／PDF。","文件正文內容沿用 v0.2。"],"previous":"v0.2","html":"<h1><span>【QA】遊戲 QA 工程師 (Quality Assurance Engineer)<\/span><\/h1>\n\n<h2>【職務簡述】<\/h2>\n<ul>\n  <li>負責 iGaming 遊戲產品的品質驗證，主要包含 <strong>Mini Game signer 說明問題、風險及測試結果，<span>重點在共同解決問題，而不是增加不必要的流程或審批。<\/span><\/li>\n<li class=\"changed\"><strong>具生成式 AI 協作思維<\/strong>：不只會操作 AI 工具，而是能主動將生成式 AI 納入實際 QA Workflow，用來協助分析、補強、驗證與自動化，同時保有自己的判斷能力，不直接照單全收。<\/li>\n<\/ul>\n<hr/>\n<h2>【需求條件】<\/h2>\n<ul>\n<li>具軟體或遊戲 QA 實務經驗，並具備獨立負責產品或專案測試工作的能力。<\/li>\n<li>具良好的邏輯分析能力，能理解功能背後的系統流程、狀態、事件及相互關係。<\/li>\n<li>能理解遊戲規則及基本遊戲系統架構，並能將理解轉化為實際測試策略與情境。<\/li>\n<li>具良好的 <strong>Test Case Design<\/strong> 能力，能從 GDD、Spec、實際系統行為及風險自行推導測試情境，而不是只依既有 Case 執行。<\/li>\n<li>熟悉基本軟體測試流程，包含：\n    <ul>\n<li>Test Case 規劃與撰寫<\/li>\n<li>Functional Test<\/li>\n<li>Integration Test<\/li>\n<li>Regression Test<\/li>\n<li>Bug Tracking<\/li>\n<li>Test Report<\/li>\n<\/ul>\n<\/li>\n<li>具基本 <strong>Log 判讀能力<\/strong>，能依據時間、事件、Error、Request / Response 等資訊協助問題定位。<\/li>\n<li>熟悉 Browser DevTools 基本操作，包含：\n    <ul>\n<li>Network<\/li>\n<li>Console<\/li>\n<li>WebSocket<\/li>\n<li>Request / Response<\/li>\n<li>Payload<\/li>\n<li>Storage<\/li>\n<\/ul>\n<\/li>\n<li>能閱讀基本 API / JSON 資料結構，並利用相關資訊協助判斷前端、後端或第三方系統問題。<\/li>\n<li>能撰寫清楚且可重現的 Bug Report，包含環境、前置條件、操作步驟、實際結果、預期結果、發生頻率及相關證據。<\/li><li class=\"changed\"><strong>具 Bug 分級與風險判斷能力<\/strong>：能依影響範圍、發生頻率、核心流程、玩家體驗、資料正確性與上線風險等因素，合理判斷 Bug 的 Severity / Priority；理解不同產品不一定適用同一套分級標準，並能依產品特性檢視、調整及優化 Bug 分級準則。<\/li>\n<li class=\"changed\">具實際運用生成式 AI 協作的經驗，能利用 AI 協助需求理解、測試設計、Edge Case 補強、測試資料生成、Log 分析或 Automation，並能驗證其產出品質。<\/li>\n<li>具良好的跨職能溝通能力，能與 PM、RD、Game Designer 等角色有效合作。<\/li>\n<li class=\"deleted\">能長時間獨立負責 QA 工作，並具備未來協助帶領小型 QA 團隊的能力。<\/li>\n<\/ul>\n<hr/>\n<h2>【加分項目】<\/h2>\n<ul>\n<li>具 <strong>iGaming / Casino Game<\/strong> 相關測試經驗。<\/li>\n<li>具 Mini Game、Special Game、Slot、骰寶或其他 Table Game 測試經驗。<\/li>\n<li>具 Live Game／視訊類產品測試經驗。<\/li>\n<li>熟悉弱網、斷線重連、Latency、Buffering、A/V Sync 等測試情境。<\/li>\n<li>具 WebSocket 或即時事件系統測試經驗。<\/li>\n<li>具第三方 API／系統串接測試經驗。<\/li>\n<li>具基本 SQL 查詢能力，能利用資料庫輔助驗證測試結果。<\/li>\n<li>了解 Git 基本概念與操作。<\/li>\n<li>具自動化測試經驗，例如 Playwright、Selenium、Appium 等。<\/li>\n<li>具 Python、JavaScript 或其他 Scripting 經驗。<\/li>\n<li>具 CI/C       else if (!SECTION_PREFIX.test(t)) errors.push(`details[${i}] 要以「章節名：」開頭`);
      else if (chars(t) > AI_DETAIL_MAX) errors.push(`details[${i}] 超過 ${AI_DETAIL_MAX} 字`);
    });
    if (typeof ai.model !== "string" || !ai.model.trim()) errors.push("model 不可空白");
    if (typeof ai.generatedAt !== "string" || Number.isNaN(Date.parse(ai.generatedAt))) errors.push("generatedAt 必須是 ISO 時間");
    if (ai.contentHash !== contentHash) errors.push("contentHash 與版本內容的 SHA-256 不符");
    return errors;
  }
  function usableAiSummary(version) {
    const ai = version && version.aiSummary;
    if (!ai || !version.hash) return null;
    return aiSummaryErrors(ai, version.hash).length ? null : ai;
  }

  // src/ui/elements.js
  var IDS = [
    "doc",
    "versionButton",
    "versionLabel",
    "versionMenu",
    "versionControl",
    "versionCard",
    "cardTitle",
    "compareBadge",
    "statusBadge",
    "cardSummary",
    "detailList",
    "versionHash",
    "toggleChanges",
    "editState",
    "newRevisionBtn",
    "editorBtn",
    "editorBackdrop",
    "editorNameInput",
    "clearEditorBtn",
    "cancelEditorBtn",
    "saveEditorBtn",
    "publishStatus",
    "shareUrlBtn",
    "copyBtn",
    "exportReviewBtn",
    "exportRevisionBtn",
    "importRevisionBtn",
    "importFile",
    "acceptRevisionBtn",
    "printBtn",
    "revisionPanel",
    "revisionTitle",
    "revisionBase",
    "revisionStatus",
    "revisionSummary",
    "revisionMeta",
    "revisionHash"
  ];
  var el = Object.fromEntries(IDS.map((id) => [id, document.getElementById(id)]));

  // src/ui/state.js
  function readJson(id, fallback) {
    const node = document.getElementById(id);
    return JSON.parse(node && node.textContent || fallback);
  }
  var state = {
    meta: readJson("documentMeta", "{}"),
    versions: readJson("versionData"),
    docState: readJson("documentState"),
    revisions: readJson("revisionData", "[]"),
    activeVersion: null,
    activeRevision: null,
    clean: false,
    suppressObserver: false
  };
  state.activeVersion = state.docState.latestVersion;
  function latestVersion() {
    return state.docState.latestVersion;
  }
  async function ensureHash(v) {
    const data = state.versions[v];
    if (!data.hash) data.hash = await snapshotHash(data.html);
    return data.hash;
  }

  // src/ui/editor-name.js
  function editorStorageKey() {
    return "edoc-editor:" + state.docState.documentId;
  }
  function getEditorName() {
    return localStorage.getItem(editorStorageKey()) || "";
  }
  function refreshEditorButton() {
    const name = getEditorName();
    el.editorBtn.textContent = name ? "編輯者：" + name : "編輯者：未設定";
    el.editorBtn.classList.toggle("state-blue", !!name);
  }
  function initEditorDialog() {
    const { editorBtn, editorBackdrop, editorNameInput, cancelEditorBtn, saveEditorBtn, clearEditorBtn } = el;
    editorBtn.addEventListener("click", () => {
      editorNameInput.value = getEditorName();
      editorBackdrop.classList.add("show");
      setTimeout(() => editorNameInput.focus(), 0);
    });
    cancelEditorBtn.addEventListener("click", () => editorBackdrop.classList.remove("show"));
    editorBackdrop.addEventListener("click", (e) => {
      if (e.target === editorBackdrop) editorBackdrop.classList.remove("show");
    });
    saveEditorBtn.addEventListener("click", () => {
      const v = editorNameInput.value.trim();
      if (v) localStorage.setItem(editorStorageKey(), v);
      else localStorage.removeItem(editorStorageKey());
      refreshEditorButton();
      editorBackdrop.classList.remove("show");
    });
    clearEditorBtn.addEventListener("click", () => {
      localStorage.removeItem(editorStorageKey());
      editorNameInput.value = "";
      refreshEditorButton();
      editorBackdrop.classList.remove("show");
    });
    editorNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveEditorBtn.click();
      if (e.key === "Escape") editorBackdrop.classList.remove("show");
    });
  }

  // src/ui/doc-surface.js
  var OBSERVER_OPTIONS = { childList: true, subtree: true, characterData: true };
  var observer = new MutationObserver((mutations) => {
    if (state.suppressObserver || !state.activeRevision) return;
    for (const m of mutations) {
      m.removedNodes.forEach((n) => {
        if (n.nodeType === 1 && n.dataset && n.dataset.edocBlock && !n.classList.contains("deletion-record")) {
          const tomb = n.cloneNode(true);
          tomb.classList.remove("revision-changed");
          tomb.classList.add("deletion-record");
          tomb.contentEditable = "false";
          withObserverPaused(() => {
            try {
              m.target.insertBefore(tomb, m.nextSibling);
            } catch (e) {
            }
          });
        }
      });
      m.addedNodes.forEach((n) => {
        if (n.nodeType === 1) {
          const node = n;
          if (!node.dataset.edocBlock && node.matches && node.matches(BLOCK_SELECTOR)) node.dataset.edocBlock = allocateNewBlockId();
          if (!node.classList.contains("deletion-record")) node.classList.add("revision-changed");
        }
      });
    }
    state.activeRevision.html = el.doc.innerHTML;
  });
  function withObserverPaused(fn) {
    observer.disconnect();
    try {
      return fn();
    } finally {
      observer.observe(el.doc, OBSERVER_OPTIONS);
    }
  }
  function setDocHtml(html) {
    withObserverPaused(() => {
      el.doc.innerHTML = html;
    });
  }
  function nearestBlock(node) {
    let n = node;
    if (!n) return null;
    if (n.nodeType === 3) n = n.parentElement;
    if (!n) return null;
    return n.closest ? n.closest(BLOCK_SELECTOR) : null;
  }
  function allocateNewBlockId() {
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function annotateBlocks(root = el.doc) {
    let i = 1;
    root.querySelectorAll(BLOCK_SELECTOR).forEach((b) => {
      if (!b.dataset.edocBlock) b.dataset.edocBlock = "b" + i++;
    });
  }
  function leaveRevisionView() {
    if (state.activeRevision) state.activeRevision.html = el.doc.innerHTML;
    state.activeRevision = null;
  }
  var preInputBlockId = null;
  function markChangedFromEvent() {
    if (!state.activeRevision) return;
    let block = null;
    if (preInputBlockId) block = el.doc.querySelector('[data-edoc-block="' + CSS.escape(preInputBlockId) + '"]');
    if (!block) {
      const sel = window.getSelection();
      block = nearestBlock(sel && sel.anchorNode);
    }
    if (block && !block.classList.contains("deletion-record")) {
      if (!block.dataset.edocBlock) block.dataset.edocBlock = allocateNewBlockId();
      block.classList.add("revision-changed");
    }
    preInputBlockId = null;
    state.activeRevision.html = el.doc.innerHTML;
  }
  function initDocSurface() {
    el.doc.addEventListener("beforeinput", () => {
      if (!state.activeRevision) return;
      const sel = window.getSelection();
      const b = nearestBlock(sel && sel.anchorNode);
      if (b) {
        if (!b.dataset.edocBlock) b.dataset.edocBlock = allocateNewBlockId();
        preInputBlockId = b.dataset.edocBlock;
      } else preInputBlockId = null;
    });
    observer.observe(el.doc, OBSERVER_OPTIONS);
    el.doc.addEventListener("input", markChangedFromEvent);
  }

  // src/ui/version-view.js
  function aiChip() {
    const c = document.createElement("span");
    c.className = "ai-chip";
    c.textContent = "AI";
    return c;
  }
  function localDate(iso) {
    const d = new Date(iso), p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function renderAiSummary(data) {
    const ai = usableAiSummary(data);
    if (!ai) return;
    const stat = document.createElement("div");
    stat.className = "ai-stat";
    stat.textContent = "變更統計：" + data.summary;
    el.cardSummary.replaceChildren(aiChip(), document.createTextNode(ai.summary), stat);
    const heading = (text, meta) => {
      const li = document.createElement("li");
      li.className = "ai-sec";
      li.textContent = text;
      if (meta) {
        const m = document.createElement("span");
        m.className = "ai-meta";
        m.textContent = meta;
        li.appendChild(m);
      }
      return li;
    };
    const items = ai.details.map((t) => {
      const li = document.createElement("li");
      li.textContent = t;
      return li;
    });
    [...el.detailList.children].forEach((li) => {
      if (li.textContent.startsWith(AI_PLACEHOLDER_PREFIX)) li.remove();
    });
    el.detailList.prepend(heading("AI 語意 Changelog", ai.model + " · " + localDate(ai.generatedAt) + " · 內容雜湊相符"), ...items, heading("系統統計"));
  }
  function buildVersionMenu() {
    const { versionMenu } = el;
    versionMenu.innerHTML = "";
    versionOrder(state.versions).slice().reverse().forEach((v) => {
      const data = state.versions[v];
      const item = document.createElement("div");
      item.className = "version-item" + (!state.activeRevision && v === state.activeVersion ? " active" : "");
      const row = document.createElement("div");
      row.className = "version-row";
      const name = document.createElement("span");
      name.textContent = v;
      row.appendChild(name);
      if (v === latestVersion()) {
        const c = document.createElement("span");
        c.className = "version-current";
        c.textContent = "Current";
        row.appendChild(c);
      }
      const sum = document.createElement("div");
      sum.className = "version-summary";
      const ai = usableAiSummary(data);
      if (ai) sum.append(aiChip(), document.createTextNode(ai.summary));
      else sum.textContent = data.summary;
      item.append(row, sum);
      item.addEventListener("click", () => {
        versionMenu.classList.remove("open");
        leaveRevisionView();
        renderVersion(v);
      });
      versionMenu.appendChild(item);
    });
  }
  function clearUIHighlights() {
    [
      el.versionControl,
      el.versionCard,
      el.toggleChanges,
      el.editState,
      el.newRevisionBtn,
      el.copyBtn,
      el.exportReviewBtn,
      el.exportRevisionBtn,
      el.importRevisionBtn,
      el.acceptRevisionBtn,
      el.printBtn
    ].forEach((x) => x.classList.remove("ui-changed"));
  }
  function applyUIHighlights(v) {
    clearUIHighlights();
    const c = state.versions[v].uiChanges || [];
    if (c.includes("revision")) el.newRevisionBtn.classList.add("ui-changed");
    if (c.includes("exportReview")) el.exportReviewBtn.classList.add("ui-changed");
    if (c.includes("exportRevision")) el.exportRevisionBtn.classList.add("ui-changed");
    if (c.includes("importRevision")) el.importRevisionBtn.classList.add("ui-changed");
    if (c.includes("acceptRevision")) el.acceptRevisionBtn.classList.add("ui-changed");
    if (c.includes("hash")) el.versionCard.classList.add("ui-changed");
  }
  function applyCleanState() {
    const { clean } = state;
    el.doc.classList.toggle("clean", clean);
    el.toggleChanges.textContent = clean ? "顯示變更：關" : "顯示變更：開";
    el.toggleChanges.classList.toggle("state-blue", !clean);
    el.toggleChanges.classList.toggle("state-gray", clean);
  }
  async function renderVersion(v) {
    state.activeVersion = v;
    state.activeRevision = null;
    state.suppressObserver = true;
    const data = state.versions[v];
    setDocHtml(data.html);
    state.suppressObserver = false;
    el.doc.contentEditable = "false";
    el.doc.classList.remove("editing");
    el.editState.textContent = "正式版：唯讀";
    el.editState.className = "state-gray";
    el.editState.disabled = true;
    el.acceptRevisionBtn.textContent = "建立新版本";
    el.exportRevisionBtn.disabled = true;
    el.acceptRevisionBtn.disabled = true;
    el.newRevisionBtn.disabled = false;
    el.revisionPanel.classList.remove("show", "conflict");
    el.versionLabel.textContent = v + (v === latestVersion() ? " · Current" : "");
    el.cardTitle.textContent = v + "｜版本摘要";
    el.cardSummary.textContent = data.summary;
    el.compareBadge.textContent = data.previous ? "比較基準：" + data.previous : "第一版";
    el.statusBadge.textContent = v === latestVersion() ? "Current" : "歷史版・唯讀";
    el.statusBadge.className = "badge " + (v === latestVersion() ? "current" : "readonly");
    el.detailList.innerHTML = "";
    data.details.forEach((x) => {
      const li = document.createElement("li");
      li.textContent = x;
      el.detailList.appendChild(li);
    });
    el.versionHash.textContent = "SHA-256：" + await ensureHash(v);
    renderAiSummary(data);
    applyCleanState();
    applyUIHighlights(v);
    buildVersionMenu();
  }

  // src/ui/revision-panel.js
  function escapeHtml(t) {
    const d = document.createElement("div");
    d.textContent = t;
    return d.innerHTML;
  }
  async function revisionHasConflict(r) {
    return isRevisionConflict(r, {
      documentId: state.docState.documentId,
      latestVersion: latestVersion(),
      latestHash: await ensureHash(latestVersion())
    });
  }
  async function renderRevisionPanel() {
    const r = state.activeRevision;
    if (!r) {
      el.revisionPanel.classList.remove("show", "conflict");
      return;
    }
    el.revisionPanel.classList.add("show");
    const conflict = await revisionHasConflict(r);
    el.revisionPanel.classList.toggle("conflict", conflict);
    el.revisionTitle.textContent = r.status === "imported" ? "Imported Revision" : "Draft";
    el.revisionBase.textContent = "Base " + r.baseVersion;
    el.revisionStatus.textContent = conflict ? "Conflict" : r.status === "imported" ? "Imported" : "Draft";
    if (r.status === "imported" && r.summary) el.revisionSummary.textContent = r.summary;
    el.revisionMeta.innerHTML = "<span>編輯者：" + escapeHtml(r.author || "未設定") + "</span><span>開始時間：" + escapeHtml(r.createdAt) + "</span>";
    el.revisionHash.textContent = "Base SHA-256：" + r.baseHash;
    el.acceptRevisionBtn.disabled = conflict;
  }

  // src/ui/draft.js
  function refreshDraftStats() {
    if (!state.activeRevision) return;
    try {
      const formal = buildFormalDiff(state.versions[state.activeRevision.baseVersion].html, el.doc.innerHTML);
      const stats = analyzeFormalDiff(formal);
      el.revisionSummary.textContent = stats.summary;
    } catch (e) {
      el.revisionSummary.textContent = "Draft 變更統計將於建立新版本時計算";
    }
  }
  var statsTimer = null;
  function scheduleDraftStats() {
    clearTimeout(statsTimer);
    statsTimer = setTimeout(refreshDraftStats, 300);
  }
  function initDraftStats() {
    el.doc.addEventListener("input", scheduleDraftStats);
  }
  async function startRevision() {
    const base = latestVersion();
    const baseHash = await ensureHash(base);
    const label = "Draft";
    state.activeRevision = {
      id: "rev-" + Date.now(),
      label,
      baseVersion: base,
      baseHash,
      author: getEditorName() || "未設定",
      role: "",
      summary: "",
      createdAt: nowISO(),
      status: "draft",
      html: cleanSnapshot(state.versions[base].html),
      documentId: state.docState.documentId
    };
    state.revisions.push(state.activeRevision);
    state.suppressObserver = true;
    setDocHtml(state.activeRevision.html);
    annotateBlocks();
    state.suppressObserver = false;
    el.doc.contentEditable = "true";
    el.doc.classList.add("editing");
    document.execCommand("defaultParagraphSeparator", false, "p");
    el.editState.textContent = "修訂模式：可編輯";
    el.editState.className = "state-green";
    el.editState.disabled = true;
    el.acceptRevisionBtn.textContent = "建立新版本";
    el.versionLabel.textContent = "Draft · Base " + base;
    el.exportRevisionBtn.disabled = false;
    el.acceptRevisionBtn.disabled = false;
    el.newRevisionBtn.disabled = true;
    renderRevisionPanel();
    buildVersionMenu();
    refreshDraftStats();
  }

  // src/engine/publish.js
  function isPublished(loc) {
    return loc.protocol === "https:" || loc.protocol === "http:";
  }
  function shareableUrl(loc) {
    return loc.href.split("#")[0];
  }

  // src/ui/publish-bar.js
  function initPublishBar() {
    const { publishStatus, shareUrlBtn } = el;
    shareUrlBtn.addEventListener("click", async () => {
      if (shareUrlBtn.disabled) return;
      try {
        await navigator.clipboard.writeText(shareableUrl(location));
        const old = shareUrlBtn.textContent;
        shareUrlBtn.textContent = "已複製網址";
        setTimeout(() => shareUrlBtn.textContent = old, 1200);
      } catch (e) {
        alert("無法直接複製網址，請從瀏覽器網址列複製。");
      }
    });
    const live = isPublished(location);
    publishStatus.textContent = live ? "Published" : "Local";
    publishStatus.classList.toggle("live", live);
    publishStatus.classList.toggle("local", !live);
    shareUrlBtn.disabled = !live;
  }

  // src/ui/revision-io.js
  var embed = (v) => JSON.stringify(v).replace(/<\//g, "<\\/");
  function syncEmbeddedState() {
    if (state.activeRevision) state.activeRevision.html = el.doc.innerHTML;
    state.docState.openRevisionId = state.activeRevision ? state.activeRevision.id : null;
    document.getElementById("versionData").textContent = embed(state.versions);
    document.getElementById("documentState").textContent = embed(state.docState);
    document.getElementById("revisionData").textContent = embed(state.revisions);
  }
  function downloadBlob(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function exportReviewHTML() {
    syncEmbeddedState();
    const serialized = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const name = state.meta.reviewFileName || state.docState.documentId + ".edoc-review.html";
    downloadBlob(name, serialized, "text/html;charset=utf-8");
  }
  function exportRevisionPackage() {
    const r = state.activeRevision;
    if (!r) return;
    r.html = el.doc.innerHTML;
    const pkg = makeRevisionPackage(state.docState.documentId, r);
    downloadBlob(r.label.replace(/\s+/g, "_") + ".edoc-revision.json", JSON.stringify(pkg, null, 2), "application/json;charset=utf-8");
  }
  async function importRevisionText(text, filename) {
    const pkg = parseRevisionFile(text, filename);
    const r = pkg.revision;
    r.html = sanitizeRevisionHtml(r.html);
    r.status = "imported";
    if (!r.documentId) r.documentId = pkg.documentId;
    state.revisions.push(r);
    state.activeRevision = r;
    state.suppressObserver = true;
    setDocHtml(r.html);
    state.suppressObserver = false;
    el.doc.contentEditable = "false";
    el.doc.classList.remove("editing");
    el.editState.textContent = "匯入修訂：審閱中";
    el.editState.className = "state-gray";
    el.acceptRevisionBtn.textContent = "接受為新版本";
    el.versionLabel.textContent = "Imported Revision · Base " + r.baseVersion;
    el.exportRevisionBtn.disabled = false;
    await renderRevisionPanel();
    buildVersionMenu();
  }
  async function acceptRevision() {
    const r = state.activeRevision;
    if (!r || await revisionHasConflict(r)) return;
    r.html = el.doc.innerHTML;
    const oldLatest = latestVersion();
    const newV = nextVersion(oldLatest);
    const formalDiffHtml = buildFormalDiff(state.versions[oldLatest].html, r.html);
    const stats = analyzeFormalDiff(formalDiffHtml);
    if (stats.summary === "未偵測到內容變更") {
      alert("沒有偵測到內容變更，因此不建立新版本。");
      return;
    }
    state.versions[newV] = {
      summary: stats.summary,
      details: [
        ...stats.details,
        "基準版本：" + r.baseVersion,
        "編輯者：" + (r.author || "未設定"),
        "建立時間：" + nowISO()
      ],
      previous: oldLatest,
      html: formalDiffHtml,
      uiChanges: [],
      hash: await snapshotHash(formalDiffHtml),
      aiSummary: null
    };
    r.status = "accepted";
    state.docState.latestVersion = newV;
    state.activeRevision = null;
    await renderVersion(newV);
    syncEmbeddedState();
    refreshEditorButton();
    alert("已建立 " + newV + "。版本摘要與 Changelog 已依實際 Diff 自動產生。");
  }

  // src/main.js
  initEditorDialog();
  initDocSurface();
  initDraftStats();
  initPublishBar();
  window.EDoc = {
    engineVersion: ENGINE_VERSION,
    buildFormalDiff,
    analyzeFormalDiff,
    cleanSnapshot,
    annotateBaseBlocks,
    sanitizeRevisionHtml,
    listChanges,
    usableAiSummary,
    sha256,
    ensureHash,
    versionOrder: () => versionOrder(state.versions),
    get versions() {
      return state.versions;
    }
  };
  el.versionButton.addEventListener("click", (e) => {
    e.stopPropagation();
    el.versionMenu.classList.toggle("open");
  });
  document.addEventListener("click", () => el.versionMenu.classList.remove("open"));
  el.toggleChanges.addEventListener("click", () => {
    state.clean = !state.clean;
    applyCleanState();
  });
  el.newRevisionBtn.addEventListener("click", startRevision);
  el.copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(el.doc.innerText);
      const old = el.copyBtn.textContent;
      el.copyBtn.textContent = "已複製";
      setTimeout(() => el.copyBtn.textContent = old, 1200);
    } catch (e) {
      alert("瀏覽器未允許直接複製");
    }
  });
  el.exportReviewBtn.addEventListener("click", exportReviewHTML);
  el.exportRevisionBtn.addEventListener("click", exportRevisionPackage);
  el.importRevisionBtn.addEventListener("click", () => el.importFile.click());
  el.importFile.addEventListener("change", async () => {
    const f = el.importFile.files[0];
    if (!f) return;
    try {
      await importRevisionText(await f.text(), f.name);
    } catch (e) {
      alert("匯入失敗：" + e.message);
    } finally {
      el.importFile.value = "";
    }
  });
  el.acceptRevisionBtn.addEventListener("click", acceptRevision);
  (async () => {
    refreshEditorButton();
    for (const v of versionOrder(state.versions)) await ensureHash(v);
    const reopenId = state.docState.openRevisionId;
    if (reopenId) {
      const r = state.revisions.find((x) => x.id === reopenId && x.status !== "accepted");
      if (r) {
        state.activeRevision = r;
        state.suppressObserver = true;
        setDocHtml(r.html);
        state.suppressObserver = false;
        el.doc.contentEditable = r.status === "draft" ? "true" : "false";
        el.doc.classList.toggle("editing", r.status === "draft");
        el.editState.textContent = r.status === "draft" ? "修訂模式：可編輯" : "匯入修訂：審閱中";
        el.editState.className = r.status === "draft" ? "state-green" : "state-gray";
        el.versionLabel.textContent = r.status === "imported" ? "Imported Revision · Base " + r.baseVersion : "Draft · Base " + r.baseVersion;
        el.newRevisionBtn.disabled = true;
        el.exportRevisionBtn.disabled = false;
        await renderRevisionPanel();
        buildVersionMenu();
        applyCleanState();
        return;
      }
    }
    await renderVersion(latestVersion());
  })();
})();
</script>
</body>
</html>
